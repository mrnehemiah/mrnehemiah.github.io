
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087A55">

  <meta
    name="description"
    content="ZUNE Marketplace Notifications Center"
  >

  <title>Notifications | ZUNE Marketplace</title>

  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./notifications.css?v=notifications-ultra3d-push-20261120-v2">

  <script type="module" src="./notifications.js?v=zune-public-order-id-20261125"></script>
</head>

<body>

  <main class="z-notifications-page" id="notifications-app">

    <header class="z-notifications-header">

      <a
        href="./index.html"
        class="z-notifications-back"
        aria-label="Back to ZUNE"
      >
        <span aria-hidden="true">←</span>
      </a>

      <div class="z-notifications-heading">
        <h1>Notifications</h1>
        <p>Arifa na taarifa za akaunti yako</p>
      </div>

      <button
        type="button"
        class="z-notification-settings"
        id="notification-settings-button"
        aria-label="Notification settings"
      >
        ⚙
      </button>

    </header>

    <section class="z-push-setup" aria-labelledby="zune-push-title">
      <div class="z-push-copy">
        <strong id="zune-push-title">Arifa za kwenye kifaa</strong>
        <p>Ruhusu ZUNE ikutumie taarifa hata ukurasa ukiwa umefungwa.</p>
        <small id="zune-push-status" role="status" aria-live="polite"></small>
      </div>
      <button type="button" id="zune-enable-push">Washa arifa</button>
    </section>

    <section class="z-notification-summary">

      <div>
        <span class="z-notification-summary-label">
          Arifa mpya
        </span>

        <strong id="notification-unread-count">0</strong>
      </div>

      <div class="z-notification-summary-icon">
        ♧
      </div>

    </section>

    <section class="z-notification-toolbar">

      <div class="z-notification-tabs">

        <button
          type="button"
          class="z-notification-tab active"
          data-filter="all"
        >
          Zote
        </button>

        <button
          type="button"
          class="z-notification-tab"
          data-filter="unread"
        >
          Hazijasomwa
        </button>

        <button
          type="button"
          class="z-notification-tab"
          data-filter="read"
        >
          Zilizosomwa
        </button>

      </div>

      <button
        type="button"
        class="z-mark-all-read"
        id="mark-all-notifications-read"
      >
        Soma zote
      </button>

    </section>

    <section
      class="z-notifications-list"
      id="notifications-list"
      aria-live="polite"
      aria-busy="true"
    >

      <div class="z-notifications-loading">

        <div class="z-notification-spinner"></div>

        <p>Inapakia taarifa zako...</p>

      </div>

    </section>

    <div
      class="z-notifications-message"
      id="notifications-message"
      role="status"
      hidden
    ></div>


    <section class="z-notification-preview" id="notification-preview" aria-hidden="true" hidden>
      <button type="button" class="z-preview-backdrop" data-preview-close aria-label="Close preview"></button>
      <div class="z-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="z-preview-title" tabindex="-1">
        <header class="z-preview-header"><div class="z-preview-brand"><span class="z-preview-brand-mark">Ⓩ</span><span>ZUNE</span></div><button type="button" class="z-preview-close" data-preview-close aria-label="Close preview">×</button></header>
        <div class="z-preview-content"><div class="z-preview-type-row"><span class="z-preview-icon" id="z-preview-icon">🔔</span><span class="z-preview-type" id="z-preview-type">NOTIFICATION</span><span class="z-preview-new" id="z-preview-unread" hidden>NEW</span></div><h2 id="z-preview-title">Notification title</h2><p class="z-preview-time" id="z-preview-time"></p><p class="z-preview-body" id="z-preview-body"></p><div class="z-preview-details" id="z-preview-details" hidden></div><div class="z-preview-actions" id="z-preview-actions"></div></div><footer class="z-preview-footer">ⓏⓊⓃⒺ MARKETPLACE</footer>
      </div>
    </section>
    <footer class="z-notifications-footer">
      <p>ⓏⓊⓃⒺ Marketplace</p>
      <span>Stay informed. Shop smarter.</span>
    </footer>

  </main>

</body>
</html>
