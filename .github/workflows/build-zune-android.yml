name: Build ZUNE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-zune-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZUNE_RELEASE_KEY_BASE64: ${{ secrets.ZUNE_RELEASE_KEY_BASE64 }}
      ZUNE_KEYSTORE_PASSWORD: ${{ secrets.ZUNE_KEYSTORE_PASSWORD }}
      ZUNE_KEY_ALIAS: ${{ secrets.ZUNE_KEY_ALIAS }}
      ZUNE_KEY_PASSWORD: ${{ secrets.ZUNE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Calculate app version
        run: |
          echo "ZUNE_VERSION_CODE=$(($GITHUB_RUN_NUMBER+1))" >> "$GITHUB_ENV"
          echo "ZUNE_VERSION_NAME=1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ZUNE_TAG=v1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed release APK when signing secrets exist
        id: release
        if: ${{ env.ZUNE_RELEASE_KEY_BASE64 != '' && env.ZUNE_KEYSTORE_PASSWORD != '' && env.ZUNE_KEY_ALIAS != '' && env.ZUNE_KEY_PASSWORD != '' }}
        continue-on-error: true
        run: |
          echo "$ZUNE_RELEASE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/zune-release.jks"
          export ZUNE_KEYSTORE_PATH="$RUNNER_TEMP/zune-release.jks"
          echo "ZUNE_KEYSTORE_PATH=$ZUNE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          keytool -list -keystore "$ZUNE_KEYSTORE_PATH" -storepass "$ZUNE_KEYSTORE_PASSWORD" -alias "$ZUNE_KEY_ALIAS" >/dev/null
          gradle -p android-app --refresh-dependencies :app:assembleRelease
          mkdir -p dist
          APK_PATH="$(find android-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Signed release APK was not produced. Available APK files:"
            find android-app/app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK_PATH" dist/ZUNE.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose dist/ZUNE.apk
          echo "ZUNE_BUILD_TYPE=signed-release" >> "$GITHUB_ENV"

      - name: Build installable debug APK if release is unavailable
        if: ${{ steps.release.outcome == 'failure' || env.ZUNE_RELEASE_KEY_BASE64 == '' || env.ZUNE_KEYSTORE_PASSWORD == '' || env.ZUNE_KEY_ALIAS == '' || env.ZUNE_KEY_PASSWORD == '' }}
        run: |
          gradle -p android-app --refresh-dependencies :app:assembleDebug
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/ZUNE.apk
          echo "ZUNE_BUILD_TYPE=debug-signed" >> "$GITHUB_ENV"

      - name: Verify APK package and signature
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$AAPT" dump badging dist/ZUNE.apk | grep -F "package: name='com.zune.app'"
          "$APKSIGNER" verify --verbose dist/ZUNE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUNE-Android-APK
          path: dist/ZUNE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed versioned GitHub Release
        if: ${{ env.ZUNE_BUILD_TYPE == 'signed-release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ZUNE_TAG }}
          name: ZUNE ${{ env.ZUNE_VERSION_NAME }}
          body: |
            versionCode=${{ env.ZUNE_VERSION_CODE }}
            Signed production APK.
          files: dist/ZUNE.apk
          fail_on_unmatched_files: true
          make_latest: true
