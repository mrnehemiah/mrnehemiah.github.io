name: Marketplace Live checks

on:
  push:
    branches:
      - marketplace-live-engagement-v2
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Marketplace JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in main.js home.js supabase.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
