
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#06372f">
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=market-app-icon-20261121">
  <link rel="apple-touch-icon" href="./icon.svg?v=market-app-icon-20261121">
  <link rel="manifest" href="./site.webmanifest?v=market-app-icon-20261121">

  <meta name="description" content="ZUNE Marketplace - Buy and sell with ease.">

  <title>ZUNE Marketplace</title>

  <!-- Google AdSense loader: ad placement is restricted to the Home promotional carousel. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9320038798412176" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./home-3d.css?v=20261125-universal-search-2">
  <link rel="stylesheet" href="./smart-assistant.css?v=20261126-chatgpt-composer-1">
  <link rel="stylesheet" href="./cart.css">

  <style>
    .app-loading {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7faf8;
      font-family: Arial, sans-serif;
    }

    .zune-wave {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      font-size: clamp(42px, 12vw, 65px);
      font-weight: 800;
      color: #087A55;
      letter-spacing: 2px;
    }

    .zune-wave span {
      display: inline-block;
      animation: zuneWave 1.1s ease-in-out infinite;
    }

    .zune-wave span:nth-child(1) {
      animation-delay: 0s;
    }

    .zune-wave span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .zune-wave span:nth-child(3) {
      animation-delay: 0.30s;
    }

    .zune-wave span:nth-child(4) {
      animation-delay: 0.45s;
    }

    .app-loading p {
      color: #71817a;
      font-size: 14px;
      margin-top: 22px;
      letter-spacing: 1px;
    }

    @keyframes zuneWave {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-16px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .zune-wave span {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div class="app-loading">
      <div class="zune-wave" aria-label="ZUNE">
        <span>Ⓩ</span>
        <span>Ⓤ</span>
        <span>Ⓝ</span>
        <span>Ⓔ</span>
      </div>

      <p>Inapakia ZUNE...</p>
    </div>
  </main>

  <script>
    (function () {
      var app = document.getElementById("app");
      var started = Date.now();
      var shown = false;
      function showStartupFailure(message) {
        if (shown || !app) return;
        shown = true;
        var detail = String(message || "Unknown startup error").slice(0, 500);
        app.innerHTML = '<section style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8f6;font-family:Arial,sans-serif;color:#18352a"><div style="width:min(100%,440px);background:#fff;border:1px solid #dce8e1;border-radius:18px;padding:24px;box-shadow:0 12px 36px #163b2814"><div style="font-size:28px;font-weight:900;color:#087a55">ZUNE</div><h2 style="margin:14px 0 8px">Marketplace haijafunguka</h2><p style="line-height:1.5">Imeshindikana kuanzisha ukurasa. Hakuna taarifa za akaunti zilizofutwa. Jaribu tena au tuma ujumbe huu kwa support.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f6f3;padding:12px;border-radius:10px;font-size:12px;color:#8a3028"></pre><button id="zune-startup-retry" type="button" style="margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:#087a55;color:#fff;font-weight:800">Jaribu tena</button></div></section>';
        var pre = app.querySelector("pre");
        if (pre) pre.textContent = detail;
        var retry = document.getElementById("zune-startup-retry");
        if (retry) retry.onclick = function () { location.reload(); };
      }
      window.addEventListener("error", function (event) {
        if (event && (event.message || event.filename)) {
          showStartupFailure((event.message || "Script load error") + (event.filename ? " — " + event.filename : "") + (event.lineno ? ":" + event.lineno : ""));
        }
      }, true);
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        showStartupFailure(reason && (reason.stack || reason.message) || reason || "Unhandled startup rejection");
      });
      window.setTimeout(function () {
        if (!app) return;
        var loading = app.querySelector(".app-loading, .zune-wave");
        if (loading && Date.now() - started >= 10000) {
          showStartupFailure("Marketplace haijamaliza kuanza ndani ya sekunde 10. Angalia muunganisho wa intaneti kisha jaribu tena.");
        }
      }, 10500);
    })();
  </script>
  <script type="module" src="./main.js?v=20261126-wallet-1"></script>
  <script type="module" src="./notification-bell.js"></script>
  <script type="module" src="./marketplace-template.js?v=1"></script>
</body>
</html>
