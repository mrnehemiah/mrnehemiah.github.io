<style>
  #zune-splash {
    position: fixed; inset: 0; z-index: 99999;
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 48%, #0b4937 0%, #06372b 48%, #03251d 100%);
    opacity: 1; visibility: visible;
    transition: opacity .65s ease, visibility .65s ease;
  }
  #zune-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  /* CSS failsafe: hide the intro after four seconds even if page scripts stall. */
  #zune-splash { animation: zuneSplashFailsafe 0.01s linear 4s forwards; }
  @keyframes zuneSplashFailsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }
  #zune-splash .splash-ripples {
    position: absolute; width: min(72vw, 300px); aspect-ratio: 1;
    display: grid; place-items: center; pointer-events: none;
  }
  #zune-splash .splash-ripples span {
    position: absolute; inset: 0; border: 1.5px solid rgba(115,255,204,.72);
    border-radius: 50%; box-shadow: 0 0 22px rgba(62,236,170,.22), inset 0 0 18px rgba(62,236,170,.08);
    opacity: 0; transform: scale(.32); animation: zuneRipple 3.6s ease-out infinite;
  }
  #zune-splash .splash-ripples span:nth-child(2) { animation-delay: 1.2s; }
  #zune-splash .splash-ripples span:nth-child(3) { animation-delay: 2.4s; }
  #zune-splash .splash-logo {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    gap: 3px; color: #fff; font: 900 clamp(42px, 12vw, 68px)/1 Arial,sans-serif;
    letter-spacing: -3px; text-shadow: 0 0 28px rgba(100,255,203,.25);
  }
  #zune-splash .splash-logo span { display: inline-block; animation: zuneSplashWave 1.25s ease-in-out infinite; }
  #zune-splash .splash-logo span:nth-child(2) { animation-delay: .14s; }
  #zune-splash .splash-logo span:nth-child(3) { animation-delay: .28s; }
  #zune-splash .splash-logo span:nth-child(4) { animation-delay: .42s; }
  @keyframes zuneSplashWave { 0%,65%,100% { transform:translateY(0) } 32% { transform:translateY(-13px) } }
  @keyframes zuneRipple { 0% { opacity:0; transform:scale(.32) } 12% { opacity:.8 } 82% { opacity:.12 } 100% { opacity:0; transform:scale(1.12) } }
  @media (prefers-reduced-motion: reduce) {
    #zune-splash *, #zune-splash *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    #zune-splash { transition-duration: .01ms; }
  }
</style>

<body>
  <div id="zune-splash" role="status" aria-label="ZUNE">
    <div class="splash-ripples" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="splash-logo" aria-hidden="true"><span>Ⓩ</span><span>Ⓤ</span><span>Ⓝ</span><span>Ⓔ</span></div>
  </div>
  <main id="app"></main>
  <script>
    (function () {
      // One authoritative controller: remove the overlay by looking it up fresh
      // every time, so stale element references or early app-ready events cannot
      // leave a full-screen layer above an already-rendered Home page.
      var startedAt = Date.now();
      var minimumDuration = 4000;
      var removed = false;

      function removeSplash() {
        if (Date.now() - startedAt < minimumDuration) return false;
        var node = document.getElementById("zune-splash");
        if (node) {
          node.style.setProperty("display", "none", "important");
          node.style.setProperty("visibility", "hidden", "important");
          node.style.setProperty("opacity", "0", "important");
          node.style.setProperty("pointer-events", "none", "important");
          node.remove();
        }
        removed = true;
        return true;
      }

      window.setTimeout(removeSplash, minimumDuration);
      // Re-check after page restore/background suspension and tolerate a
      // duplicate/stale splash node being reinserted by an old cached document.
      window.addEventListener("pageshow", removeSplash);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) removeSplash();
      });
      window.addEventListener("zune:app-ready", function () {
        window.setTimeout(removeSplash, Math.max(0, minimumDuration - (Date.now() - startedAt)));
      }, { once: true });

      // Short safety window after the four-second intro; stops as soon as gone.
      var checks = 0;
      var retry = window.setInterval(function () {
        checks += 1;
        if (removeSplash() || checks >= 24) window.clearInterval(retry);
      }, 300);
    })();
  </script>

  <script>
    (function () {
      var app = document.getElementById("app");
      var started = Date.now();
      var shown = false;
      var appReady = false;
      var splash = document.getElementById("zune-splash");
      window.addEventListener("zune:app-ready", function () { appReady = true; }, { once: true });
      function revealStartupFailure() {
        if (!splash) return;
        splash.classList.add("is-hidden");
        window.setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          splash = null;
        }, 750);
      }
      function showStartupFailure(message) {
        if (shown || appReady || !app) return;
        shown = true;
        revealStartupFailure();
        var detail = String(message || "Unknown startup error").slice(0, 500);
        app.innerHTML = '<section style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8f6;font-family:Arial,sans-serif;color:#18352a"><div style="width:min(100%,440px);background:#fff;border:1px solid #dce8e1;border-radius:18px;padding:24px;box-shadow:0 12px 36px #163b2814"><div style="font-size:28px;font-weight:900;color:#087a55">ZUNE</div><h2 style="margin:14px 0 8px">Marketplace haijafunguka</h2><p style="line-height:1.5">Imeshindikana kuanzisha ukurasa. Hakuna taarifa za akaunti zilizofutwa. Jaribu tena au tuma ujumbe huu kwa support.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f6f3;padding:12px;border-radius:10px;font-size:12px;color:#8a3028"></pre><button id="zune-startup-retry" type="button" style="margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:#087a55;color:#fff;font-weight:800">Jaribu tena</button></div></section>';
        var pre = app.querySelector("pre");
        if (pre) pre.textContent = detail;
        var retry = document.getElementById("zune-startup-retry");
        if (retry) retry.onclick = function () { location.reload(); };
      }
      window.addEventListener("error", function (event) {
        if (!appReady && event && (event.message || event.filename)) {
          showStartupFailure((event.message || "Script load error") + (event.filename ? " — " + event.filename : "") + (event.lineno ? ":" + event.lineno : ""));
        }
      }, true);
      window.addEventListener("unhandledrejection", function (event) {
        if (appReady) return;
        var reason = event && event.reason;
        showStartupFailure(reason && (reason.stack || reason.message) || reason || "Unhandled startup rejection");
      });
      window.setTimeout(function () {
        if (!app || appReady) return;
        var loading = app.querySelector(".app-loading, .zune-wave");
        if (loading && Date.now() - started >= 10000) {
          showStartupFailure("Marketplace haijamaliza kuanza ndani ya sekunde 10. Angalia intaneti kisha jaribu tena.");
          return;
        }
        if (!shown && !appReady) {
          showStartupFailure("ZUNE haijaanzisha programu ndani ya sekunde 15. Inawezekana main.js au faili lake halijapakiwa. Jaribu tena au tuma taarifa hii kwa support.");
        }
      }, 15000);
    })();
  </script>
